# Run the market worker on GitHub Actions.
#
# A free option that needs no credit card: public repositories get unlimited
# standard-runner minutes. It is a genuine trade-off, not a free lunch —
# see the caveats below — but it covers a trading session without a host.
#
# Setup: Settings > Secrets and variables > Actions, add
#   REDIS_URL, DATABASE_URL, ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY
#
# Caveats, honestly:
#   - A job is capped at 6 hours. A regular session is 6.5, so the last ~30
#     minutes are not covered by a single run.
#   - Scheduled workflows are best-effort. Measured on this repository: runs
#     scheduled for 13:20 and 14:20 UTC actually started at 18:15 and 18:45,
#     roughly five hours late. The gate below therefore accepts any time the
#     market is still open rather than only the pre-open window, so a delayed
#     run covers whatever remains of the session instead of doing nothing.
#   - The worker holds no state between runs. Restarting re-reads the session
#     snapshot, so RVOL recovers, but signal cooldowns reset.
#
# For guaranteed coverage, run it somewhere persistent instead.

name: Market worker

on:
  schedule:
    # 13:20 UTC covers 09:20 ET during daylight saving; 14:20 UTC covers it in
    # winter. Both fire year-round and the guard below stops the wrong one, so
    # this needs no seasonal editing.
    - cron: '20 13 * * 1-5'
    - cron: '20 14 * * 1-5'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to run for'
        required: false
        default: '350'

# Never two workers at once: they would double every signal and race the
# state machine. A second run waits rather than being cancelled, so if one
# does queue it covers the tail of the session the six-hour cap cuts off.
concurrency:
  group: market-worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    # Just under the 6-hour ceiling, so the job ends on our terms and logs a
    # clean shutdown rather than being killed mid-write.
    timeout-minutes: 355

    steps:
      - name: Check this is the right run for today's timezone
        id: gate
        run: |
          # Only proceed when New York is shortly before the open. On a
          # scheduled run the other cron entry will be the correct one.
          ny_hour=$(TZ=America/New_York date +%H)
          ny_min=$(TZ=America/New_York date +%M)
          echo "New York time: ${ny_hour}:${ny_min}"

          minutes_of_day=$((10#$ny_hour * 60 + 10#$ny_min))

          # 09:00 to 15:45 New York. Deliberately wide: a scheduled run can
          # arrive hours after its cron time, and a narrow pre-open window
          # turned every late run into a no-op. Late coverage of part of a
          # session beats none.
          #
          # Both cron entries can match on the same day, which is what the
          # concurrency group above is for — the second is queued, not run
          # alongside, and two workers would double every signal.
          OPEN=540      # 09:00
          CLOSE=945     # 15:45, leaving no time for a run that cannot do useful work

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run." && echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif (( minutes_of_day >= OPEN && minutes_of_day <= CLOSE )); then
            echo "Within the trading day." && echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside the trading day; nothing useful to collect."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install
        if: steps.gate.outputs.proceed == 'true'
        run: npm ci

      - name: Run the worker until the session ends
        if: steps.gate.outputs.proceed == 'true'
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_FEED: iex
          MARKET_DATA_PROVIDER: alpaca
          LOG_LEVEL: info
        run: |
          # Never run past the close: a late start should finish at 16:05 New
          # York rather than idling on a dead tape for its full six hours.
          now=$(( $(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          until_close=$(( 965 - now ))          # 16:05 New York
          requested="${{ github.event.inputs.minutes || '350' }}"
          MINUTES=$(( until_close < requested ? until_close : requested ))
          (( MINUTES < 1 )) && MINUTES=1

          echo "Running the worker for ${MINUTES} minutes (until the close, capped at ${requested})"
          # SIGTERM on timeout so the worker's shutdown handler runs.
          timeout --signal=TERM "${MINUTES}m" npx tsx worker/src/index.ts || code=$?
          # 124 is timeout's "ran to completion", which is the expected ending.
          if [[ "${code:-0}" == "124" || "${code:-0}" == "0" ]]; then
            echo "Session window finished."
          else
            echo "Worker exited with ${code}"
            exit "${code}"
          fi
